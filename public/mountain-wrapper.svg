<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Маска с градиентом для плавного перехода -->
    <linearGradient id="fadeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:1" />
      <stop offset="70%" style="stop-color:white;stop-opacity:1" />
      <stop offset="90%" style="stop-color:white;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    
    <mask id="fadeMask">
      <rect x="0" y="0" width="800" height="450" fill="url(#fadeGradient)" />
    </mask>
    
    <!-- Фильтр размытия для облаков -->
    <filter id="cloudBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
  </defs>
  
  <!-- Фон GitHub цвета -->
  <rect width="800" height="450" fill="#202830"/>
  
  <!-- Изображение горы с маской -->
  <image href="mountain.png" x="0" y="0" width="800" height="400" mask="url(#fadeMask)"/>
  
  <!-- Облака внизу для плавного перехода -->
  <g filter="url(#cloudBlur)">
    <ellipse cx="200" cy="400" rx="150" ry="60" fill="#202830" opacity="0.6"/>
    <ellipse cx="400" cy="410" rx="180" ry="50" fill="#202830" opacity="0.5"/>
    <ellipse cx="600" cy="405" rx="160" ry="55" fill="#202830" opacity="0.6"/>
  </g>
  
  <!-- Дополнительный градиент для усиления перехода -->
  <rect x="0" y="350" width="800" height="100" fill="url(#bottomFade)" opacity="0.8"/>
  
  <defs>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#202830;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#202830;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
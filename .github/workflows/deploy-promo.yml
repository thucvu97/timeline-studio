name: Deploy Promo Page

on:
  push:
    branches: [ main ]
    paths:
      - 'promo/**'
      - '.github/workflows/deploy-promo.yml'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd promo
          npm install

      - name: Sync changelog
        run: |
          node scripts/sync-changelog.js

      - name: Prepare content
        run: |
          cd promo
          mkdir -p public/content
          cp -r content/changelog public/content/

      - name: Build promo page
        run: |
          cd promo
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: promo/dist
          branch: gh-pages
          clean: false
          target-folder: ./
          token: ${{ secrets.GITHUB_TOKEN }}

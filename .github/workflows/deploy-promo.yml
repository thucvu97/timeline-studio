name: Deploy Promo Page

on:
  push:
    branches: [ main ]
    paths:
      - 'promo/**'
      - '.github/workflows/deploy-promo.yml'
      - 'CHANGELOG.md'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd promo
          bun install

      - name: Sync changelog
        run: |
          cp CHANGELOG.md promo/content/changelog/latest.md
          cp CHANGELOG.md promo/public/content/changelog/latest.md

      - name: Build promo page
        run: |
          cd promo
          bun run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: promo/dist
          branch: gh-pages
          clean: false
          target-folder: ./
          token: ${{ secrets.GITHUB_TOKEN }}
